# Revisa cada semana si hay versiones nuevas (con parches de seguridad) de las dependencias
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Solo versiones LTS de Node (pares). Las impares tienen soporte de ~6 meses.
      - dependency-name: node
        versions: ["25", "27", "29"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
